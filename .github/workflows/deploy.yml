name: Deploy

# TEMPORARY: Workers Builds' build image has no Rust and its build cache does
# not cover ~/.cargo or target/, so building there recompiles worker-build on
# every push. Build in GitHub Actions so the Rust toolchain and the installed
# worker-build binary can be cached. Revisit when cf/Workers Builds supports
# Rust natively or caches Cargo artifacts:
# https://github.com/cloudflare/workers-rs/issues/1021
# https://github.com/cloudflare/workers-rs/pull/1069

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  CF_SEND_TELEMETRY: "false"

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: wasm32-unknown-unknown

      # Caches ~/.cargo (including the installed worker-build binary) and target/.
      - uses: Swatinem/rust-cache@v2

      # A cold cache compiles worker-build (~4 minutes); a warm cache skips it.
      - run: cargo install --locked --version 0.8.7 worker-build

      - run: pnpm build:production

      # --dry-run sends no API requests, so this validates the bundle and the
      # Build Output rather than the live bindings.
      - if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        run: pnpm deploy-check:production

      # cf deploy also applies routes, custom domains, cron schedules and queue
      # consumers, so a separate triggers step is not required.
      - if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        run: pnpm deploy:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
