[package]
name = "lucy-telemetry"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
publish = false
description = "lucy's telemetry worker backend"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "0.8.7", features = ["d1", "queue"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "wasmbind"] }
uuid = { version = "1", default-features = false, features = ["std"] }
sha2 = "0.10"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
regex = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
